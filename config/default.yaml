lab:
  provider: "virtualbox"
  vms:
    - name: "win10-target"
      ip: "192.168.56.101"
      os: "windows10"
      credentials:
        username: "admin"
        password: "{{ env.LAB_VM_PASSWORD }}"
      snapshot_clean: "clean-baseline"
      snapshot_telemetry: "with-sysmon"

atomic:
  repo_path: "/opt/atomic-red-team"
  techniques:
    - "T1003.001"  # LSASS Memory
    - "T1003.008"  # /etc/passwd and /etc/shadow
    - "T1059.001"  # PowerShell
    - "T1059.003"  # Windows Command Shell
    - "T1105"      # Ingress Tool Transfer
    - "T1055"      # Process Injection
    - "T1070.004"  # File Deletion
  execution_args: {}

telemetry:
  collectors:
    - type: "sysmon"
      config:
        config_file: "configs/sysmon-config.xml"
        log_path: "Microsoft-Windows-Sysmon/Operational"
    - type: "windows_event"
      config:
        channels:
          - "Security"
          - "System"
          - "Microsoft-Windows-PowerShell/Operational"
          - "Microsoft-Windows-WMI/Operational"
    - type: "edr_json"
      config:
        endpoint: "http://localhost:8080/api/events"
        api_key: "{{ env.EDR_API_KEY }}"
  output_dir: "data/telemetry"
  retention_days: 30

detection:
  output_dir: "data/rules"
  rule_template: "templates/sigma-rule.yml.j2"
  min_confidence: "low"
  false_positive_checks: true

evaluation:
  rules_dir: "data/rules"
  telemetry_dir: "data/telemetry"
  output_dir: "data/evaluation"
  sigma_backend: "sigmac"